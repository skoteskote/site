# ---------------------------------------------------------------------------
# The portfolio at /portfolio/ is built entirely from this file.
#
# A project is a list of ROWS. A row has a layout and one or two CELLS.
#   layout: full   -> a single cell spanning the full content width
#   layout: split  -> two equal columns, vertically centred
#
# Each project carries its title, year and attribution. Those three make the
# first line of the meta block: "Title, Year | By". Set by_url to link the name.
#
# A cell is one of:
#   image:       filename in assets/portfolio/, plus alt, optional caption
#   video:       a Vimeo id and hash (normal Vimeo embed, 16:9)
#   text:        filename in _includes/portfolio/, plus the meta block above it
#   placeholder: a line of text in a tinted frame, for material still to come
#
# Anything you can imagine falls out of that: two large images side by side is
# a split with two image cells, two square images stacked in each column is two
# split rows, two columns of text is a split with two text cells, and so on.
# Swap the order of the cells to move the image from the right to the left.
#
# In the markdown files:
#   a paragraph that is entirely in *italics* becomes the opening lede
#   a > blockquote becomes a pull quote, its last line the attribution
#
# bg: the background tint the page eases to while that image is on screen.
# Generate it for a new image with:  python3 tools/portfolio-tints.py
# ---------------------------------------------------------------------------

